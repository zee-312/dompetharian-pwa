<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>DompetHarian — Primary Origami D Logo Mark</title>
  <desc>Clean geometric origami wallet forming the letter D with negative-space channels, warm marigold coin in the counter, and sage leaf upper fold.</desc>
  <defs>
    <linearGradient id="bgCard" x1="48" y1="48" x2="464" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F3EDE2"/>
    </linearGradient>
    <linearGradient id="espressoSpine" x1="116" y1="104" x2="188" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2C2522"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="sageLeafFold" x1="204" y1="104" x2="396" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B7357"/>
      <stop offset="100%" stop-color="#2E5A44"/>
    </linearGradient>
    <linearGradient id="terracottaPocketFold" x1="204" y1="248" x2="396" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D96B43"/>
      <stop offset="100%" stop-color="#B84A24"/>
    </linearGradient>
    <linearGradient id="marigoldCoin" x1="224" y1="216" x2="296" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4C152"/>
      <stop offset="100%" stop-color="#D99B26"/>
    </linearGradient>
  </defs>

  <!-- Soft Warm Paper Container -->
  <g id="Background-Surface">
    <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgCard)" stroke="#E5DEC9" stroke-width="4"/>
  </g>

  <!-- 1. Left Vertical Spine of Letter 'D' (Stitched Espresso Leather) -->
  <g id="Origami-D-Spine">
    <rect x="116" y="108" width="68" height="296" rx="28" fill="url(#espressoSpine)"/>
    <line x1="150" y1="136" x2="150" y2="376" stroke="#FAF7F2" stroke-opacity="0.38" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round"/>
  </g>

  <!-- 2. Upper Curved Origami Fold + Organic Sage Leaf Tip -->
  <g id="Origami-D-Upper-Sage-Leaf">
    <path d="M200 108 H268 C343.111 108 404 168.889 404 244 V246 H328 V242 C328 206.654 299.346 178 264 178 H200 V108 Z" fill="url(#sageLeafFold)"/>
    <!-- Minimalist Leaf Tip Accent at Top-Right of Fold -->
    <path d="M352 132 C372 106 404 102 418 106 C414 126 398 150 370 156" fill="#3B7357"/>
    <path d="M362 144 C378 128 394 118 410 112" stroke="#FAF7F2" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 3. Lower Curved Origami Pocket Fold (Warm Terracotta) -->
  <g id="Origami-D-Lower-Terracotta-Pocket">
    <path d="M328 262 H404 V268 C404 343.111 343.111 404 268 404 H200 V334 H264 C299.346 334 328 305.346 328 270 V262 Z" fill="url(#terracottaPocketFold)"/>
    <!-- Wallet Clasp Dot on Lower Flap -->
    <circle cx="366" cy="296" r="7" fill="#FAF7F2"/>
  </g>

  <!-- 4. Center Counter Coin (Nestled Cleanly Inside the Hollow of 'D') -->
  <g id="Center-Rupiah-Coin">
    <circle cx="258" cy="256" r="42" fill="url(#marigoldCoin)"/>
    <circle cx="258" cy="256" r="30" stroke="#FAF7F2" stroke-opacity="0.65" stroke-width="2.5"/>
    <circle cx="258" cy="256" r="10" fill="#1C1917"/>
  </g>
</svg>
